<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Poker Amigos</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08110c;color:white;font-family:Arial,sans-serif}header{padding:14px 18px;background:#121b16;display:flex;justify-content:space-between}.wrap{max-width:1200px;margin:auto;padding:14px}.card{background:#132019;border:1px solid #31513f;border-radius:14px;padding:14px;margin-bottom:12px}input,button{padding:11px;border-radius:10px;border:1px solid #3b5b49;background:#0d1711;color:white;font-size:15px}button{background:#207149;border:0}.secondary{background:#39483f}.danger{background:#8b3030}.row{display:flex;gap:8px;flex-wrap:wrap}.muted{color:#9fb2a5;font-size:13px}#lobby{max-width:550px;margin:40px auto}.hidden{display:none}.code{font-size:24px;font-weight:bold;letter-spacing:4px}.grid{display:grid;grid-template-columns:1fr 310px;gap:12px}.table{height:620px;position:relative;border-radius:50%;background:radial-gradient(ellipse,#1c744d,#0a3c28 68%,#06271b);border:15px solid #4b3425;box-shadow:0 15px 50px #0008}.community{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);display:flex;gap:6px}.pcard{width:48px;height:68px;background:#fff;color:#111;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:19px}.red{color:#b01818}.seat{position:absolute;transform:translate(-50%,-50%);width:145px;text-align:center}.avatar{background:#17241d;border:1px solid #6c8f79;padding:7px;border-radius:12px}.chips{font-size:12px;color:#d1e1d6}.hand{display:flex;justify-content:center}.mini{width:25px;height:36px;margin:3px;font-size:11px}.s0{left:50%;top:8%}.s1{left:78%;top:19%}.s2{left:91%;top:43%}.s3{left:83%;top:70%}.s4{left:67%;top:91%}.s5{left:50%;top:96%}.s6{left:33%;top:91%}.s7{left:17%;top:70%}.s8{left:9%;top:43%}.s9{left:22%;top:19%}#messages{height:150px;overflow:auto;background:#09110c;border-radius:10px;padding:8px}.msg{margin:5px 0}
@media(max-width:800px){.grid{grid-template-columns:1fr}.table{height:520px;border-width:9px}.seat{width:105px;font-size:12px}.pcard{width:40px;height:57px}.mini{width:21px;height:30px}.s1{left:80%}.s9{left:20%}}
</style></head><body><header><b>♠ Poker Amigos — Texas Hold'em</b><span id="status" class="muted">Sin sala</span></header><div class="wrap">
<section id="lobby" class="card"><h2>Crear o entrar</h2><input id="name" placeholder="Tu nombre" maxlength="20"><div class="row" style="margin-top:8px"><button onclick="create()">Crear sala</button><input id="join" placeholder="Código" maxlength="6" style="width:120px;text-transform:uppercase"><button class="secondary" onclick="join()">Entrar</button></div><p class="muted">De 2 a 10 jugadores. Fichas virtuales. Compatible con celulares.</p></section>
<section id="game" class="hidden"><div class="card row" style="justify-content:space-between;align-items:center"><div>Código: <span id="roomCode" class="code"></span></div><div class="row"><button class="secondary" onclick="copy()">Copiar enlace</button><button id="start" onclick="send({type:'start'})">Iniciar mano</button></div></div>
<div class="grid"><main><div class="table"><div id="community" class="community"></div><div id="seats"></div></div><div class="card row"><button class="danger" onclick="send({type:'fold'})">Retirarse</button><button onclick="send({type:'call'})">Pagar</button><input id="amount" type="number" value="20" min="1" style="width:85px"><button onclick="send({type:'bet',amount:+amount.value})">Apostar</button></div></main>
<aside><div class="card"><b>👑 Crupier</b><p class="muted">El creador controla el avance de las calles.</p><div class="row"><button onclick="send({type:'dealer_next'})">Siguiente calle</button><button class="secondary" onclick="send({type:'newhand'})">Nueva mano</button></div></div>
<div class="card"><b>Bote</b><div id="pot" style="font-size:30px">0</div><span id="street" class="muted"></span></div>
<div class="card"><b>Chat</b><div id="messages"></div><div class="row" style="margin-top:8px"><input id="chat" placeholder="Mensaje" style="flex:1"><button onclick="chat()">Enviar</button></div></div></aside></div></section></div>
<script>
let ws,me;const $=x=>document.getElementById(x);function connect(){ws=new WebSocket((location.protocol==="https:"?"wss":"ws")+"://"+location.host);ws.onmessage=e=>handle(JSON.parse(e.data))}
function send(x){if(ws&&ws.readyState===1)ws.send(JSON.stringify(x))}
function create(){connect();setTimeout(()=>send({type:"create",name:$("name").value||"Crupier"}),200)}
function join(){connect();setTimeout(()=>send({type:"join",code:$("join").value,name:$("name").value||"Jugador"}),200)}
function handle(m){if(m.type==="created"||m.type==="joined"){me=m.playerId;$("roomCode").textContent=m.code;$("lobby").classList.add("hidden");$("game").classList.remove("hidden");history.replaceState({},'',location.pathname+"?sala="+m.code);render(m.state)}if(m.type==="state")render(m.state);if(m.type==="chat"){$("messages").innerHTML+=`<div class="msg"><b>${esc(m.name)}:</b> ${esc(m.text)}</div>`}if(m.type==="error")alert(m.message)}
function render(s){$("status").textContent=s.players.length+" jugador(es)";$("pot").textContent=s.pot+" fichas";$("street").textContent=s.street;let c=$("community");c.innerHTML="";s.community.forEach(x=>c.appendChild(card(x)));let q=$("seats");q.innerHTML="";s.players.forEach((p,i)=>{let d=document.createElement("div");d.className="seat s"+i;d.innerHTML=`<div class="avatar">${p.id===s.dealer?"👑 ":""}<b>${esc(p.name)}</b><div class="chips">${p.chips} fichas · apuesta ${p.bet}</div></div>`;q.appendChild(d)})}
function card(c){let d=document.createElement("div");d.className="pcard "+(["♥","♦"].includes(c.s)?"red":"");d.textContent=c.r+c.s;return d}
function copy(){navigator.clipboard?.writeText(location.href).then(()=>alert("Enlace copiado"))}function chat(){let x=$("chat");if(x.value.trim()){send({type:"chat",text:x.value.trim()});x.value=""}}function esc(s){return String(s).replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]))}
</script></body></html>
